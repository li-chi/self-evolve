schema_version = "1.3"

[task]
name = "toolathlon/task-tracker"
description = "Please find all developers' branches in the `BenchTasksCollv3` project for the most recent commits that added new tasks. For each person\u2019s new tasks, "
keywords = ["toolathlon", "github", "notion"]

[metadata]
toolathlon_task = "task-tracker"
toolathlon_split = "finalpool"
needed_mcp_servers = ["github", "notion"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
