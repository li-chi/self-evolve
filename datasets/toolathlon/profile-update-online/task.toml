schema_version = "1.3"

[task]
name = "toolathlon/profile-update-online"
description = "I\u2019ve recently uploaded two articles (B-Star and SimpleRL-Zoo). Please update my local profile repository strictly following my **existing publications"
keywords = ["toolathlon", "filesystem", "playwright_with_chunk", "scholarly", "arxiv_local", "pdf-tools"]

[metadata]
toolathlon_task = "profile-update-online"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "playwright_with_chunk", "scholarly", "arxiv_local", "pdf-tools"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
