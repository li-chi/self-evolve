schema_version = "1.3"

[task]
name = "toolathlon/wandb-best-score"
description = "Analyze the wandb project https://wandb.ai/mluo/deepscaler-1.5b?nw=nwusermluo, identify the experiment with the best validation set performance, and f"
keywords = ["toolathlon", "wandb", "filesystem", "terminal"]

[metadata]
toolathlon_task = "wandb-best-score"
toolathlon_split = "finalpool"
needed_mcp_servers = ["wandb", "filesystem", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
