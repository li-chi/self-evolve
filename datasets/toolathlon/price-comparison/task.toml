schema_version = "1.3"

[task]
name = "toolathlon/price-comparison"
description = "As a member of the market analysis team, you are urgently tasked with analyzing the price differences between our core product line and our primary co"
keywords = ["toolathlon", "filesystem", "terminal", "pdf-tools", "google-cloud"]

[metadata]
toolathlon_task = "price-comparison"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "terminal", "pdf-tools", "google-cloud"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
