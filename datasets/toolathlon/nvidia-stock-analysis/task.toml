schema_version = "1.3"

[task]
name = "toolathlon/nvidia-stock-analysis"
description = "Please help me analyze the ownership and market trends of NVIDIA (NVDA). In the current workspace, there is an Excel template provided named \"results_"
keywords = ["toolathlon", "yahoo-finance", "filesystem", "terminal", "excel", "web_search", "playwright_with_chunk"]

[metadata]
toolathlon_task = "nvidia-stock-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["yahoo-finance", "filesystem", "terminal", "excel", "web_search", "playwright_with_chunk"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
