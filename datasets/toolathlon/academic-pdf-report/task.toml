schema_version = "1.3"

[task]
name = "toolathlon/academic-pdf-report"
description = "I am conducting research on papers for an AI Conference. For each paper, please help me find the full name of the first author, the complete instituti"
keywords = ["toolathlon", "playwright_with_chunk", "excel", "terminal", "arxiv_local", "pdf-tools", "fetch"]

[metadata]
toolathlon_task = "academic-pdf-report"
toolathlon_split = "finalpool"
needed_mcp_servers = ["playwright_with_chunk", "excel", "terminal", "arxiv_local", "pdf-tools", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
