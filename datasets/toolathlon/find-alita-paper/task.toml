schema_version = "1.3"

[task]
name = "toolathlon/find-alita-paper"
description = "I'm looking for a paper on arxiv related to agentic reasoning. I only remember that its title contains \"Alita\" and it was published in June 2025 or ea"
keywords = ["toolathlon", "arxiv_local", "filesystem", "scholarly"]

[metadata]
toolathlon_task = "find-alita-paper"
toolathlon_split = "finalpool"
needed_mcp_servers = ["arxiv_local", "filesystem", "scholarly"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
