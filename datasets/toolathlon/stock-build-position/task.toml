schema_version = "1.3"

[task]
name = "toolathlon/stock-build-position"
description = "I am preparing to open a stock position today. `stock.xlsx` contains the companies I want to purchase and and I plan to buy all the company shares in "
keywords = ["toolathlon", "excel", "yahoo-finance", "terminal"]

[metadata]
toolathlon_task = "stock-build-position"
toolathlon_split = "finalpool"
needed_mcp_servers = ["excel", "yahoo-finance", "terminal"]
launch_time = "2026-07-31 16:48:28"

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"
