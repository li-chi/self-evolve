schema_version = "1.3"

[task]
name = "toolathlon/nhl-b2b-analysis"
description = "Conduct a detailed analysis of the NHL 2024\u20132025 schedule (in spreadsheet `NHL 2425 Schedule`) and calculate how many back-to-back sets each team will"
keywords = ["toolathlon", "google_sheet", "filesystem", "terminal"]

[metadata]
toolathlon_task = "nhl-b2b-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google_sheet", "filesystem", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
