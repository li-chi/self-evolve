schema_version = "1.3"

[task]
name = "toolathlon/add-bibtex"
description = "Please help me add the following article to the ref.bib file in the workspace. Please keep the format consistent with the existing article. If there i"
keywords = ["toolathlon", "scholarly", "playwright_with_chunk", "filesystem", "terminal", "fetch"]

[metadata]
toolathlon_task = "add-bibtex"
toolathlon_split = "finalpool"
needed_mcp_servers = ["scholarly", "playwright_with_chunk", "filesystem", "terminal", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
