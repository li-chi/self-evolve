schema_version = "1.3"

[task]
name = "toolathlon/live-transactions"
description = "A suspicious transaction (ID: T8492XJ3) has been detected in the live_transactions table. Please query all data related to this transaction ID from th"
keywords = ["toolathlon", "google-cloud", "filesystem"]

[metadata]
toolathlon_task = "live-transactions"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google-cloud", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
