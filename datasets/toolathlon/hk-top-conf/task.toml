schema_version = "1.3"

[task]
name = "toolathlon/hk-top-conf"
description = "I'm a third-year undergraduate student majoring in Computer Science, and I plan to pursue a Ph.D. in Deep Learning in Hong Kong after graduation. My t"
keywords = ["toolathlon", "filesystem", "terminal", "playwright_with_chunk", "fetch"]

[metadata]
toolathlon_task = "hk-top-conf"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "terminal", "playwright_with_chunk", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
