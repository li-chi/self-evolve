schema_version = "1.3"

[task]
name = "toolathlon/llm-training-dataset"
description = "I've been learning about large-scale language models recently, and I've decided to train a decoder-only language model on my own. The first step is to"
keywords = ["toolathlon", "playwright_with_chunk", "google_sheet", "scholarly", "fetch"]

[metadata]
toolathlon_task = "llm-training-dataset"
toolathlon_split = "finalpool"
needed_mcp_servers = ["playwright_with_chunk", "google_sheet", "scholarly", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
