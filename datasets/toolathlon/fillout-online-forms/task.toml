schema_version = "1.3"

[task]
name = "toolathlon/fillout-online-forms"
description = "My good friend Alex and I both want to attend the Freshmen Welcome Party and participate for the whole day. Please help me fill out the questionnaire "
keywords = ["toolathlon", "playwright_with_chunk", "memory", "filesystem"]

[metadata]
toolathlon_task = "fillout-online-forms"
toolathlon_split = "finalpool"
needed_mcp_servers = ["playwright_with_chunk", "memory", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
