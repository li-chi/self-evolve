schema_version = "1.3"

[task]
name = "toolathlon/apply-phd-email"
description = "Please check my inbox for an email from 'kaiming', and then help me submit the relevant materials according to his request. All materials are in the w"
keywords = ["toolathlon", "filesystem", "memory", "emails", "terminal", "pdf-tools"]

[metadata]
toolathlon_task = "apply-phd-email"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "memory", "emails", "terminal", "pdf-tools"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
