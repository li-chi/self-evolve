schema_version = "1.3"

[task]
name = "toolathlon/trip-adviser"
description = "I want to depart from the Nihonbashi Exit of Tokyo Station, with the goal of reaching Kamakura Station. I prefer a direct route. I'd like to buy a Sta"
keywords = ["toolathlon", "google_map", "fetch", "filesystem", "playwright_with_chunk"]

[metadata]
toolathlon_task = "trip-adviser"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google_map", "fetch", "filesystem", "playwright_with_chunk"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
