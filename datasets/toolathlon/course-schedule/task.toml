schema_version = "1.3"

[task]
name = "toolathlon/course-schedule"
description = "My personal information is stored in Memory. The workspace contains my course schedule and a master exam table (in Excel format). The courses I need t"
keywords = ["toolathlon", "filesystem", "memory", "excel", "pdf-tools", "fetch"]

[metadata]
toolathlon_task = "course-schedule"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "memory", "excel", "pdf-tools", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
