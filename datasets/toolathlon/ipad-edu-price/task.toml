schema_version = "1.3"

[task]
name = "toolathlon/ipad-edu-price"
description = "You are an Apple education discount analysis assistant, and I am a university student in Hong Kong. I want to buy an iPad Pro (256GB, 11-inch) and an "
keywords = ["toolathlon", "yahoo-finance", "playwright_with_chunk", "fetch"]

[metadata]
toolathlon_task = "ipad-edu-price"
toolathlon_split = "finalpool"
needed_mcp_servers = ["yahoo-finance", "playwright_with_chunk", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
