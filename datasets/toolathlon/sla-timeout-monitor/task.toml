schema_version = "1.3"

[task]
name = "toolathlon/sla-timeout-monitor"
description = "Identify the tickets in the database that have exceeded the initial response time according to the relevant documentation, and send reminder emails\u2014ba"
keywords = ["toolathlon", "emails", "snowflake", "filesystem", "pdf-tools", "terminal"]

[metadata]
toolathlon_task = "sla-timeout-monitor"
toolathlon_split = "finalpool"
needed_mcp_servers = ["emails", "snowflake", "filesystem", "pdf-tools", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
