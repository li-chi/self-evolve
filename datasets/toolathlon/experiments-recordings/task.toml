schema_version = "1.3"

[task]
name = "toolathlon/experiments-recordings"
description = "In the table of the Notion page `mcp_experiments_recordings`, based on the historical experiments of W&B project `mbzuai-llm/Guru`, list the highest v"
keywords = ["toolathlon", "notion", "wandb", "terminal", "filesystem"]

[metadata]
toolathlon_task = "experiments-recordings"
toolathlon_split = "finalpool"
needed_mcp_servers = ["notion", "wandb", "terminal", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
