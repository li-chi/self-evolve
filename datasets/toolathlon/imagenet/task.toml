schema_version = "1.3"

[task]
name = "toolathlon/imagenet"
description = "I am a graduate student in computer vision, and I have several papers on image generation in my workspace. I need your help to summarize the experimen"
keywords = ["toolathlon", "filesystem", "pdf-tools"]

[metadata]
toolathlon_task = "imagenet"
