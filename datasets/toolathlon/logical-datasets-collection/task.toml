schema_version = "1.3"

[task]
name = "toolathlon/logical-datasets-collection"
description = "Hello! I am a PhD student engaged in deep learning research. Recently, my collaborators and I have proposed a logical reasoning dataset and are writin"
keywords = ["toolathlon", "filesystem", "scholarly", "arxiv_local", "pdf-tools", "fetch"]

[metadata]
toolathlon_task = "logical-datasets-collection"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "scholarly", "arxiv_local", "pdf-tools", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
