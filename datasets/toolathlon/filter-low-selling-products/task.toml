schema_version = "1.3"

[task]
name = "toolathlon/filter-low-selling-products"
description = "Please help me check which products are in my shop, filter out those that have been in stock for more than 90 days and have sold fewer than 10 units i"
keywords = ["toolathlon", "woocommerce", "filesystem", "emails"]

[metadata]
toolathlon_task = "filter-low-selling-products"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "filesystem", "emails"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
