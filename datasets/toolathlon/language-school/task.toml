schema_version = "1.3"

[task]
name = "toolathlon/language-school"
description = "You are preparing a graduate application report for an international student (not a U.S. citizen or current permanent resident) who wants to apply for"
keywords = ["toolathlon", "filesystem", "playwright_with_chunk", "excel", "fetch", "terminal"]

[metadata]
toolathlon_task = "language-school"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "playwright_with_chunk", "excel", "fetch", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
