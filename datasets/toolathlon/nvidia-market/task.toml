schema_version = "1.3"

[task]
name = "toolathlon/nvidia-market"
description = "Your task is to analyze NVIDIA\u2019s institutional ownership trends over 8 quarters (2023\u202fQ1 to 2024\u202fQ4)."
keywords = ["toolathlon", "yahoo-finance", "filesystem", "terminal", "playwright_with_chunk", "excel", "fetch"]

[metadata]
toolathlon_task = "nvidia-market"
toolathlon_split = "finalpool"
needed_mcp_servers = ["yahoo-finance", "filesystem", "terminal", "playwright_with_chunk", "excel", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
