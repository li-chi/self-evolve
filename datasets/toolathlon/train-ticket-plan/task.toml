schema_version = "1.3"

[task]
name = "toolathlon/train-ticket-plan"
description = "My friend and I have planned a trip to qufu(\u66f2\u961c). We will depart on the evening of next Thursday (trains departing after 5 PM) and leave on Sunday afte"
keywords = ["toolathlon", "filesystem", "rail_12306", "terminal", "fetch"]

[metadata]
toolathlon_task = "train-ticket-plan"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "rail_12306", "terminal", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
