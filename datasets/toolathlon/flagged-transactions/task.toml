schema_version = "1.3"

[task]
name = "toolathlon/flagged-transactions"
description = "Perform anomaly detection on high-net-worth clients\u2019 transactions: Extract the 2025 transactions of clients in `high_value_clients.csv` from BigQuery "
keywords = ["toolathlon", "google-cloud", "excel", "terminal", "filesystem"]

[metadata]
toolathlon_task = "flagged-transactions"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google-cloud", "excel", "terminal", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
