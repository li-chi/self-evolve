schema_version = "1.3"

[task]
name = "toolathlon/personal-website-construct"
description = "Please fork https://github.com/academicpages/academicpages.github.io and rename it as `LJT-Homepage` on my github repo, and fill in it with the person"
keywords = ["toolathlon", "memory", "github"]

[metadata]
toolathlon_task = "personal-website-construct"
toolathlon_split = "finalpool"
needed_mcp_servers = ["memory", "github"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
