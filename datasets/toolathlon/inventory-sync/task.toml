schema_version = "1.3"

[task]
name = "toolathlon/inventory-sync"
description = "I am a WooCommerce store owner, and my shop has warehouses in the following cities: New York, Boston, Dallas, LA, San Francisco, Houston. Please help "
keywords = ["toolathlon", "woocommerce", "filesystem"]

[metadata]
toolathlon_task = "inventory-sync"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
