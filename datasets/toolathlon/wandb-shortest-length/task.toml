schema_version = "1.3"

[task]
name = "toolathlon/wandb-shortest-length"
description = "Analyze the wandb project https://wandb.ai/mluo/deepscaler-1.5b?nw=nwusermluo, using the experiment logs to analyze which experiment results should be"
keywords = ["toolathlon", "wandb", "filesystem", "terminal", "excel"]

[metadata]
toolathlon_task = "wandb-shortest-length"
toolathlon_split = "finalpool"
needed_mcp_servers = ["wandb", "filesystem", "terminal", "excel"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
