schema_version = "1.3"

[task]
name = "toolathlon/latex-prompt-box"
description = "Only edit the TODO part at the end of the appendix within my paper Latex project, without affecting any other content of the paper to help me do so: A"
keywords = ["toolathlon", "filesystem", "arxiv-latex", "terminal"]

[metadata]
toolathlon_task = "latex-prompt-box"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "arxiv-latex", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
