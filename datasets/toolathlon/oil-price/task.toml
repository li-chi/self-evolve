schema_version = "1.3"

[task]
name = "toolathlon/oil-price"
description = "I have prepared two data tables in the Notion `Oil Price` page. Please fetch WTI and Brent monthly prices for the last 12 months from Yahoo Finance, a"
keywords = ["toolathlon", "yahoo-finance", "notion", "filesystem", "terminal"]

[metadata]
toolathlon_task = "oil-price"
toolathlon_split = "finalpool"
needed_mcp_servers = ["yahoo-finance", "notion", "filesystem", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
