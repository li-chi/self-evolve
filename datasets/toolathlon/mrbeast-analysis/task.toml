schema_version = "1.3"

[task]
name = "toolathlon/mrbeast-analysis"
description = "As a novice video content creator, I want to analyze the video style and patterns of the creator \"MrBeast.\" I'd like to understand when his videos typ"
keywords = ["toolathlon", "youtube", "filesystem", "excel", "youtube-transcript"]

[metadata]
toolathlon_task = "mrbeast-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["youtube", "filesystem", "excel", "youtube-transcript"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
