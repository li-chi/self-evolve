schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-customer-survey"
description = "Use the WooCommerce to check all order status updates for customers marked as \"Completed\", and send a Google Forms feedback questionnaire about their "
keywords = ["toolathlon", "woocommerce", "emails", "google_forms", "filesystem"]

[metadata]
toolathlon_task = "woocommerce-customer-survey"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "emails", "google_forms", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
