schema_version = "1.3"

[task]
name = "toolathlon/privacy-desensitization"
description = "Scan workspace documents and produce desensitized copies with sensitive data replaced by /hidden/"
keywords = ["toolathlon", "filesystem", "local-only"]

[metadata]
toolathlon_task = "privacy-desensitization"
toolathlon_split = "finalpool"
toolathlon_track = "local"
needed_mcp_servers = ["filesystem", "terminal"]

artifacts = ["/app/desensitized_documents"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"
