schema_version = "1.3"

[task]
name = "toolathlon/music-analysis"
description = "A music streaming platform wants to accurately identify the 1940s pop singles with the most sustained popularity during their classic oldies promotion"
keywords = ["toolathlon", "excel", "google_sheet", "terminal"]

[metadata]
toolathlon_task = "music-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["excel", "google_sheet", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
