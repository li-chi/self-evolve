schema_version = "1.3"

[task]
name = "toolathlon/academic-warning"
description = "The academic affairs system requires an automated academic warning mechanism. The latest unit test scores are recorded in the `latest_quiz_scores.csv`"
keywords = ["toolathlon", "google-cloud", "excel", "filesystem"]

[metadata]
toolathlon_task = "academic-warning"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google-cloud", "excel", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
