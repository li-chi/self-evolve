schema_version = "1.3"

[task]
name = "toolathlon/verl-dataset"
description = "I'm trying to use the Verl framework to replicate DeepSeek-R1's \"aha moment\" on a language model I've trained. To do this, I need help downloading the"
keywords = ["toolathlon", "huggingface", "filesystem", "fetch"]

[metadata]
toolathlon_task = "verl-dataset"
toolathlon_split = "finalpool"
needed_mcp_servers = ["huggingface", "filesystem", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
