schema_version = "1.3"

[task]
name = "toolathlon/dataset-license-issue"
description = "Someone just filed an issue in my Annoy-DataSync project asking about the license information for our released datasets. Could you please help me figu"
keywords = ["toolathlon", "huggingface", "github", "terminal", "fetch"]

[metadata]
toolathlon_task = "dataset-license-issue"
toolathlon_split = "finalpool"
needed_mcp_servers = ["huggingface", "github", "terminal", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
