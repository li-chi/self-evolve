schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-new-welcome"
description = "Please check all customers who have completed their first order in our store in the past 7 days and immediately sync their information (name, email ad"
keywords = ["toolathlon", "woocommerce", "filesystem", "terminal", "google-cloud", "emails"]

[metadata]
toolathlon_task = "woocommerce-new-welcome"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "filesystem", "terminal", "google-cloud", "emails"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
