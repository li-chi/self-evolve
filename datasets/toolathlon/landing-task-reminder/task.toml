schema_version = "1.3"

[task]
name = "toolathlon/landing-task-reminder"
description = "Today we have 3 new employees joining us, and each employee's information is stored in the Snowflake database."
keywords = ["toolathlon", "emails", "snowflake", "pdf-tools", "filesystem"]

[metadata]
toolathlon_task = "landing-task-reminder"
toolathlon_split = "finalpool"
needed_mcp_servers = ["emails", "snowflake", "pdf-tools", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
