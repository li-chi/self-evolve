schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-stock-alert"
description = "You need to read the inventory levels of WooCommerce products, check the current stock quantity (stock_quantity) for each product against the safety t"
keywords = ["toolathlon", "woocommerce", "google_sheet", "emails", "filesystem"]

[metadata]
toolathlon_task = "woocommerce-stock-alert"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "google_sheet", "emails", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
