schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-update-cover"
description = "Update the main product image based on WooCommerce order data, setting the image of the best-selling variation of each product as the main product ima"
keywords = ["toolathlon", "woocommerce"]

[metadata]
toolathlon_task = "woocommerce-update-cover"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
