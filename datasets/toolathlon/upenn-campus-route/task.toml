schema_version = "1.3"

[task]
name = "toolathlon/upenn-campus-route"
description = "I am currently at the University of Pennsylvania (UPenn) Bookstore. I would like to take a walking tour of the campus attractions. A few days ago, I s"
keywords = ["toolathlon", "filesystem", "terminal", "google_map", "fetch"]

[metadata]
toolathlon_task = "upenn-campus-route"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "terminal", "google_map", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
