schema_version = "1.3"

[task]
name = "toolathlon/sync-todo-to-readme"
description = "In branch dev of **my** LUFFY repo, I have written some new code that I have implemented based on TODO. Please search all .py files and extract the co"
keywords = ["toolathlon", "git", "github"]

[metadata]
toolathlon_task = "sync-todo-to-readme"
toolathlon_split = "finalpool"
needed_mcp_servers = ["git", "github"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
