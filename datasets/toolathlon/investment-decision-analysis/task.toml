schema_version = "1.3"

[task]
name = "toolathlon/investment-decision-analysis"
description = "You are an investment analysis assistant. Please use Yahoo Finance to perform financial analysis. Create three separate spreadsheets(Note that these a"
keywords = ["toolathlon", "yahoo-finance", "google_sheet", "excel", "filesystem"]

[metadata]
toolathlon_task = "investment-decision-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["yahoo-finance", "google_sheet", "excel", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
