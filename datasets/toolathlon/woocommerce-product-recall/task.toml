schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-product-recall"
description = "Remove products of a specified model from your WooCommerce store and recall the corresponding products. The product must be taken off the shelf (set t"
keywords = ["toolathlon", "woocommerce", "emails", "google_forms", "filesystem"]

[metadata]
toolathlon_task = "woocommerce-product-recall"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "emails", "google_forms", "filesystem"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
