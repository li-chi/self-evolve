schema_version = "1.3"

[task]
name = "toolathlon/set-conf-cr-ddl"
description = "Check my emails from the past day. If any mention the COML conference main-track camera-ready deadline, schedule a calendar reminder for me three hour"
keywords = ["toolathlon", "emails", "google_calendar"]

[metadata]
toolathlon_task = "set-conf-cr-ddl"
toolathlon_split = "finalpool"
needed_mcp_servers = ["emails", "google_calendar"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
