schema_version = "1.3"

[task]
name = "toolathlon/course-assistant"
description = "I am the teaching assistant for the NLP course. The final presentation assignments from the students have now been received in my email. All the stati"
keywords = ["toolathlon", "excel", "emails", "filesystem", "terminal"]

[metadata]
toolathlon_task = "course-assistant"
toolathlon_split = "finalpool"
needed_mcp_servers = ["excel", "emails", "filesystem", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
