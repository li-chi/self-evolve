schema_version = "1.3"

[task]
name = "toolathlon/woocommerce-new-product"
description = "As an operator of the WooCommerce e-commerce platform, you need to send emails to customers about new product reservations and discount reminders. Spe"
keywords = ["toolathlon", "woocommerce", "filesystem", "emails"]

[metadata]
toolathlon_task = "woocommerce-new-product"
toolathlon_split = "finalpool"
needed_mcp_servers = ["woocommerce", "filesystem", "emails"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
