schema_version = "1.3"

[task]
name = "toolathlon/gdp-cr5-analysis"
description = "Please read the table titled \"GDP2022\" in Google Sheets and calculate the CR5 index for each of the seven major regions listed by the World Bank. Crea"
keywords = ["toolathlon", "google_sheet", "playwright_with_chunk", "fetch"]

[metadata]
toolathlon_task = "gdp-cr5-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google_sheet", "playwright_with_chunk", "fetch"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
