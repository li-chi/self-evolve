schema_version = "1.3"

[task]
name = "toolathlon/quantitative-financial-analysis"
description = "Please create a Google Sheet named '2025_Market_Data' with a worksheet titled 'Jun-Jul_2025', retrieve daily stock data for Apple, Tesla, Nvidia, and "
keywords = ["toolathlon", "filesystem", "yahoo-finance", "google_sheet", "notion", "terminal"]

[metadata]
toolathlon_task = "quantitative-financial-analysis"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "yahoo-finance", "google_sheet", "notion", "terminal"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
