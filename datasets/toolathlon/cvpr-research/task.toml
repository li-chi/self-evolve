schema_version = "1.3"

[task]
name = "toolathlon/cvpr-research"
description = "I am a doctoral student in computer vision and will graduate next year. My career plan is to become a teacher in a university, so after graduating wit"
keywords = ["toolathlon", "filesystem", "fetch", "playwright_with_chunk"]

[metadata]
toolathlon_task = "cvpr-research"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "fetch", "playwright_with_chunk"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
