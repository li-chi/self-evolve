schema_version = "1.3"

[task]
name = "toolathlon/machine-operating"
description = "A production line in the factory streams real-time data through IoT sensors into the live_sensor table of the machine_operating dataset in BigQuery. T"
keywords = ["toolathlon", "google-cloud", "filesystem", "excel"]

[metadata]
toolathlon_task = "machine-operating"
toolathlon_split = "finalpool"
needed_mcp_servers = ["google-cloud", "filesystem", "excel"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
