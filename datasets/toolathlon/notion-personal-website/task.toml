schema_version = "1.3"

[task]
name = "toolathlon/notion-personal-website"
description = "You need to update a notion page named `Colley Whisson` based on the information provided in the `colley_whisson.docx` document."
keywords = ["toolathlon", "filesystem", "word", "notion"]

[metadata]
toolathlon_task = "notion-personal-website"
toolathlon_split = "finalpool"
needed_mcp_servers = ["filesystem", "word", "notion"]

artifacts = ["/app"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
network_mode = "public"
workdir = "/app"

[environment.healthcheck]
command = "test -f /var/run/toolathlon/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 5.0
start_interval_sec = 5.0
retries = 120
