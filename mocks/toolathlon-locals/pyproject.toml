[project]
name = "toolathlon-locals-mcp"
version = "0.1.0"
description = "MCP server porting Toolathlon's local-* tools (basic, python-execute, web_search, ai_webpage_summary, context_management, history, overlong)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[tool.setuptools]
py-modules = ["server"]
