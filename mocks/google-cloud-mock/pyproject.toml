[project]
name = "google-cloud-mock-mcp"
version = "0.1.0"
description = "Google Cloud-shaped mock MCP server matching lockon-n/google-cloud-mcp tool surface"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
google-cloud-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
