[project]
name = "replay-proxy-mcp"
version = "0.1.0"
description = "Generic Tier-B replay-proxy MCP server: deterministic replay of pre-recorded tool responses keyed by (tool, canonical args hash)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
replay = "replay.cli:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["replay"]
